name: Release

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.2.0)'
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            artifact: clone-linux-x86_64
    # NOTE: aarch64-unknown-linux-musl is intentionally not in this
    # matrix. The current codebase calls x86_64-only KVM ioctls
    # (set_pit2 / set_irqchip / kvmclock_ctrl / get_pit2 /
    # get_irqchip / get_clock) without arch-cfg gating, so the
    # aarch64 target produces ~114 compile errors. Re-add aarch64
    # once the cross-arch refactor in docs/SPEC.md "Roadmap" lands.
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build static binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare artifact
        run: |
          cd target/${{ matrix.target }}/release
          cp clone ${{ matrix.artifact }}
          sha256sum ${{ matrix.artifact }} > ${{ matrix.artifact }}.sha256

      - name: Smoke test
        run: |
          chmod +x target/${{ matrix.target }}/release/clone
          target/${{ matrix.target }}/release/clone --help
          echo "Binary smoke test passed"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            target/${{ matrix.target }}/release/${{ matrix.artifact }}
            target/${{ matrix.target }}/release/${{ matrix.artifact }}.sha256

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          artifact-name: clone-sbom.spdx.json
          output-file: artifacts/clone-sbom.spdx.json

      - name: Sign artifacts with Cosign
        uses: sigstore/cosign-installer@v4

      - name: Sign checksums
        run: |
          cd artifacts
          cat *.sha256 > SHA256SUMS
          cosign sign-blob --yes --output-signature SHA256SUMS.sig --output-certificate SHA256SUMS.pem SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: artifacts/clone-linux-x86_64

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          generate_release_notes: true
          files: |
            artifacts/clone-linux-x86_64
            artifacts/clone-linux-x86_64.sha256
            artifacts/SHA256SUMS
            artifacts/SHA256SUMS.sig
            artifacts/SHA256SUMS.pem
            artifacts/clone-sbom.spdx.json
