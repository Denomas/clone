name: Lint extras

# Shift-left guards beyond the per-PR fmt + clippy in build.yml:
#
#   - clippy-curated  (BLOCKING):
#       A small hand-picked subset of pedantic / correctness lints that
#       currently have zero violations in this codebase. We hard-deny
#       them so the count cannot regress upward without an explicit
#       fix. Keep this set small and 0-violation; promote individual
#       lints into it once they are clean.
#
#   - clippy-strict   (advisory, continue-on-error):
#       Full clippy::pedantic + clippy::nursery as warnings. Surfaces
#       potential issues for contributors without blocking the merge
#       gate. Ratchet items out of here into clippy-curated as they
#       go to zero.
#
#   - coverage        (BLOCKING per file in coverage-floor.txt):
#       cargo-llvm-cov runs the workspace, then we compare per-file
#       line coverage against the floors checked in at
#       .github/coverage-floor.txt. Any listed file dropping below its
#       floor fails the job. Files not in the list are unconstrained.
#
#   - summary         (always-on aggregator):
#       Composes a single Markdown report from the three jobs above
#       (curated/advisory clippy counts + per-file coverage with delta
#       vs floor) and posts it to the PR as a sticky comment under the
#       header `lint-extras`. Mirrors aggregate status onto branch
#       protection.
#
# A Miri job is intentionally absent — see the comment block above
# the clippy-curated job for the reason and the exit criterion.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "0 6 * * *" # nightly 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # NOTE: a Miri job belongs here too, but the workspace root crate is
  # binary-only (no [lib] target) and the leaf crates' tests use libc /
  # KVM ioctls that Miri cannot model. The roadmap is to extract
  # pure-logic parsers (vsock packet header, virtio descriptors,
  # kernel cmdline, control-plane protocol framing) into a separate
  # `lib` crate — once they live in their own crate Miri can run
  # against them end-to-end. Tracked in docs/SPEC.md under Needs Work.

  clippy-curated:
    name: Clippy (curated zero-violation set, blocking)
    runs-on: ubuntu-latest
    outputs:
      violations: ${{ steps.cnt.outputs.violations }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Curated correctness lints (deny)
        # Each of these currently reports 0 violations in this tree.
        # Adding one to the set means the codebase is clean for that
        # lint at the time of promotion; future PRs cannot reintroduce
        # the pattern without touching the lint config.
        run: |
          cargo clippy --all-targets -- \
            -D clippy::cloned_instead_of_copied \
            -D clippy::imprecise_flops \
            -D clippy::large_types_passed_by_value \
            -D clippy::lossy_float_literal \
            -D clippy::manual_assert \
            -D clippy::rest_pat_in_fully_bound_structs \
            -D clippy::unnested_or_patterns \
            -D clippy::verbose_file_reads 2>&1 | tee /tmp/curated.log
      - name: Count violations
        id: cnt
        if: always()
        run: |
          v=$(grep -cE "^error: " /tmp/curated.log || true)
          echo "violations=$v" >> "$GITHUB_OUTPUT"
      - name: Job summary
        if: always()
        run: |
          {
            echo "## Clippy (curated, blocking)"
            echo
            echo "Violations: \`${{ steps.cnt.outputs.violations }}\`"
            echo
            echo "<details><summary>Lint set</summary>"
            echo
            echo '- `cloned_instead_of_copied`'
            echo '- `imprecise_flops`'
            echo '- `large_types_passed_by_value`'
            echo '- `lossy_float_literal`'
            echo '- `manual_assert`'
            echo '- `rest_pat_in_fully_bound_structs`'
            echo '- `unnested_or_patterns`'
            echo '- `verbose_file_reads`'
            echo
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

  clippy-strict:
    name: Clippy (advisory pedantic + nursery)
    runs-on: ubuntu-latest
    continue-on-error: true
    outputs:
      warnings: ${{ steps.cnt.outputs.warnings }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Pedantic + nursery (warnings only)
        # --color never strips ANSI escapes so the warning-counter grep
        # below matches '^warning: ...' lines reliably regardless of the
        # workflow-level CARGO_TERM_COLOR setting.
        run: cargo clippy --all-targets --color never -- -W clippy::pedantic -W clippy::nursery 2>&1 | tee /tmp/strict.log
      - name: Count warnings
        id: cnt
        if: always()
        run: |
          w=$(grep -cE "^warning: " /tmp/strict.log || true)
          echo "warnings=$w" >> "$GITHUB_OUTPUT"
      - name: Job summary
        if: always()
        run: |
          {
            echo "## Clippy (pedantic + nursery, advisory)"
            echo
            echo "Warnings: \`${{ steps.cnt.outputs.warnings }}\`"
            echo
            echo "_Ratchet items into the curated set as they go to zero._"
          } >> "$GITHUB_STEP_SUMMARY"

  coverage:
    name: Coverage report (per-file ratchet, blocking)
    runs-on: ubuntu-latest
    outputs:
      table_md: ${{ steps.ratchet.outputs.table_md }}
      total_line: ${{ steps.totals.outputs.total_line }}
      have_base: ${{ steps.ratchet.outputs.have_base }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Generate LCOV
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info
      - name: Workspace summary
        id: totals
        run: |
          cargo llvm-cov report --summary-only | tee coverage-summary.txt
          # The TOTAL row has 12 numeric columns plus the leading label:
          # Regions Missed Cover% Functions Missed Cover% Lines Missed
          # Cover% Branches Missed Cover%. We want the line coverage
          # percent, which is the third '%' value — pick it via grep.
          total_line=$(awk '/^TOTAL/ {print}' coverage-summary.txt \
                       | grep -oE '[0-9.]+%' | sed -n '3p')
          echo "total_line=${total_line:-n/a}" >> "$GITHUB_OUTPUT"
      - name: Upload report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            lcov.info
            coverage-summary.txt
          retention-days: 30

      - name: Fetch base-branch lcov.info
        # On pull_request runs, pull the latest successful Lint extras
        # run on the base branch and unpack its 'coverage-report'
        # artifact so the ratchet step below can also render a
        # 'Δ base' column. Best-effort: any failure leaves base values
        # blank and the ratchet falls back to the floor-only column.
        if: github.event_name == 'pull_request'
        id: base
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          base_ref="${{ github.base_ref }}"
          repo="${{ github.repository }}"
          wf_id=$(gh api "repos/$repo/actions/workflows/lint-extra.yml" --jq '.id')
          base_run=$(gh api "repos/$repo/actions/workflows/$wf_id/runs?branch=$base_ref&status=success&per_page=1" --jq '.workflow_runs[0].id')
          if [ -z "$base_run" ] || [ "$base_run" = "null" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          art_id=$(gh api "repos/$repo/actions/runs/$base_run/artifacts" --jq '.artifacts[] | select(.name=="coverage-report") | .id' | head -1)
          if [ -z "$art_id" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p /tmp/base
          gh api -H 'Accept: application/vnd.github+json' "repos/$repo/actions/artifacts/$art_id/zip" > /tmp/base/c.zip
          unzip -o /tmp/base/c.zip -d /tmp/base >/dev/null 2>&1
          if [ -f /tmp/base/lcov.info ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Enforce per-file ratchet floor
        # Reads .github/coverage-floor.txt and fails if any listed file
        # has dropped below its recorded floor. Floors only ratchet up:
        # when a PR genuinely raises coverage, the same PR raises the
        # floor and the new level becomes the new minimum.
        id: ratchet
        env:
          BASE_AVAILABLE: ${{ steps.base.outputs.available }}
        run: |
          set -euo pipefail
          floor_file=.github/coverage-floor.txt
          fail=0
          have_base=0
          [ "${BASE_AVAILABLE:-false}" = "true" ] && [ -f /tmp/base/lcov.info ] && have_base=1

          # Reusable awk that prints "<line-cov-percent>" for one file in lcov.info.
          pct_for_file() {
            local f="$1" lcov="$2"
            awk -v f="$f" '
              BEGIN { inside=0; cov=0; tot=0 }
              /^SF:/ {
                if (index($0, f) > 0) { inside = 1 } else { inside = 0 }
                next
              }
              inside == 1 && /^DA:/ {
                tot = tot + 1
                split($0, a, ",")
                if (a[2] + 0 > 0) { cov = cov + 1 }
              }
              inside == 1 && /^end_of_record/ { exit }
              END {
                if (tot == 0) { print 0 } else { printf "%d", cov*100/tot }
              }
            ' "$lcov"
          }

          # Build the markdown table while we walk the floor list, so we
          # can pass it to the aggregator unchanged.
          : > /tmp/cov_table.md
          if [ "$have_base" = "1" ]; then
            {
              echo "| File | Floor | Current | Δ floor | Δ base |"
              echo "|---|---:|---:|---:|---:|"
            } >> /tmp/cov_table.md
          else
            {
              echo "| File | Floor | Current | Δ floor |"
              echo "|---|---:|---:|---:|"
            } >> /tmp/cov_table.md
          fi

          while IFS=$'\t' read -r path floor; do
            case "$path" in ''|'#'*) continue ;; esac
            [ -z "${floor:-}" ] && continue
            pct=$(pct_for_file "$path" lcov.info)
            pct=${pct:-0}
            delta=$((pct - floor))
            if [ "$pct" -lt "$floor" ]; then
              echo "::error file=$path::coverage ${pct}% < floor ${floor}%"
              fail=1
              floor_icon="❌"
            else
              floor_icon="✅"
              echo "  $path: ${pct}% (floor=${floor}%, +${delta})"
            fi
            floor_sign=""
            [ "$delta" -gt 0 ] && floor_sign="+"
            # Use <code> instead of Markdown backticks: the table_md
            # output is later expanded via the dollar-double-braces
            # syntax into a shell run block, so any backtick in the
            # value would be re-evaluated as a command substitution
            # and the cell would render empty.
            row="| <code>$path</code> | ${floor}% | ${pct}% | ${floor_icon} ${floor_sign}${delta} |"
            if [ "$have_base" = "1" ]; then
              base_pct=$(pct_for_file "$path" /tmp/base/lcov.info)
              base_pct=${base_pct:-0}
              base_delta=$((pct - base_pct))
              base_sign=""
              [ "$base_delta" -gt 0 ] && base_sign="+"
              base_icon="="
              [ "$base_delta" -gt 0 ] && base_icon="📈"
              [ "$base_delta" -lt 0 ] && base_icon="📉"
              row="${row} ${base_icon} ${base_sign}${base_delta} |"
            fi
            echo "$row" >> /tmp/cov_table.md
          done < "$floor_file"

          # Expose the rendered table + base availability to the aggregator.
          {
            echo "table_md<<MARKDOWN_EOF"
            cat /tmp/cov_table.md
            echo "MARKDOWN_EOF"
            echo "have_base=$have_base"
          } >> "$GITHUB_OUTPUT"

          if [ "$fail" -eq 1 ]; then
            echo "Coverage ratchet failed. Either raise tests, or, if a"
            echo "file's coverage genuinely went up, update its floor in"
            echo ".github/coverage-floor.txt in the same PR."
            exit 1
          fi
      - name: Job summary
        if: always()
        run: |
          {
            echo "## Coverage (per-file ratchet)"
            echo
            cat /tmp/cov_table.md 2>/dev/null || echo "_Coverage table unavailable; ratchet step did not run._"
            echo
            echo "Workspace line coverage: \`${{ steps.totals.outputs.total_line }}\`"
            echo
            echo "Full report uploaded as artifact \`coverage-report\` (lcov.info + coverage-summary.txt)."
          } >> "$GITHUB_STEP_SUMMARY"

  summary:
    name: PR summary (Lint extras)
    runs-on: ubuntu-latest
    needs: [clippy-curated, clippy-strict, coverage]
    if: always()
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Compose body
        id: agg
        run: |
          icon() {
            case "$1" in
              success) echo "✅" ;;
              failure) echo "❌" ;;
              cancelled) echo "🚫" ;;
              skipped) echo "⏭️" ;;
              *) echo "❓" ;;
            esac
          }

          curated_r="${{ needs['clippy-curated'].result }}"
          strict_r="${{ needs['clippy-strict'].result }}"
          cov_r="${{ needs.coverage.result }}"

          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          sha_short="$(echo "${{ github.sha }}" | cut -c1-7)"

          {
            echo "## Lint extras — \`$sha_short\`"
            echo
            echo "Run: [#${{ github.run_number }}]($run_url)"
            echo
            echo "| Job | Result | Detail |"
            echo "|---|---|---|"
            echo "| Clippy curated (blocking) | $(icon $curated_r) \`$curated_r\` | violations: ${{ needs['clippy-curated'].outputs.violations }} |"
            echo "| Clippy advisory (pedantic + nursery) | $(icon $strict_r) \`$strict_r\` | warnings: ${{ needs['clippy-strict'].outputs.warnings }} |"
            echo "| Coverage ratchet (blocking) | $(icon $cov_r) \`$cov_r\` | workspace line: ${{ needs.coverage.outputs.total_line }} |"
            echo
            echo "### Coverage by file"
            echo
            echo "${{ needs.coverage.outputs.table_md }}"
            echo
            echo "Coverage artifact: [coverage-report]($run_url#artifacts)"
            if [ "${{ needs.coverage.outputs.have_base }}" != "1" ] && [ "${{ github.event_name }}" = "pull_request" ]; then
              echo
              echo "_Base-branch lcov.info unavailable for this run; Δ-base column omitted (no successful master Lint extras run with metrics yet)._"
            fi
            echo
            echo "<sub>Updated by \`lint-extra.yml\` · sticky-comment header \`lint-extras\`.</sub>"
          } > /tmp/body.md

          {
            echo "body<<MARKDOWN_EOF"
            cat /tmp/body.md
            echo "MARKDOWN_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Write step summary
        run: cat /tmp/body.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upsert sticky PR comment
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: lint-extras
          message: ${{ steps.agg.outputs.body }}

      - name: Gate on upstream blocking jobs
        # Curated and coverage are merge gates; advisory may stay
        # `failure` without blocking thanks to continue-on-error on the
        # job itself, but a real cancellation propagates.
        if: |
          contains(fromJSON('["failure","cancelled"]'), needs['clippy-curated'].result) ||
          contains(fromJSON('["cancelled"]'), needs['clippy-strict'].result) ||
          contains(fromJSON('["failure","cancelled"]'), needs.coverage.result)
        run: |
          echo "Blocking lint-extras job did not pass; failing aggregator."
          exit 1
