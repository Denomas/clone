name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_call:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            code:
              - 'src/**'
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'tests/**'
      - name: Job summary
        run: |
          {
            echo "## Detect changes"
            echo
            echo "Code-relevant paths changed: \`${{ steps.filter.outputs.code }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  fmt:
    name: Format
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: cargo fmt --check
        run: cargo fmt -- --check
      - name: Job summary
        if: always()
        run: |
          status="${{ job.status }}"
          {
            echo "## Format"
            echo
            echo "Result: \`$status\` (cargo fmt -- --check)"
          } >> "$GITHUB_STEP_SUMMARY"

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo clippy -- -D warnings
        # CARGO_TERM_COLOR=always at the workflow level wraps every
        # 'warning:'/'error:' marker in ANSI escapes, which breaks the
        # 'grep -E "^warning:"' counter below. Disable color for this
        # one step so the log is plain text.
        env:
          CARGO_TERM_COLOR: never
        run: cargo clippy -- -D warnings 2>&1 | tee /tmp/clippy.log
      - name: Count warnings/errors
        id: clippy_count
        if: always()
        run: |
          warn=$(grep -cE "^warning:" /tmp/clippy.log || true)
          err=$(grep -cE "^error:" /tmp/clippy.log || true)
          echo "warn=$warn" >> "$GITHUB_OUTPUT"
          echo "err=$err"   >> "$GITHUB_OUTPUT"
      - name: Job summary
        if: always()
        run: |
          {
            echo "## Clippy (deny warnings)"
            echo
            echo "| Metric | Count |"
            echo "|---|---|"
            echo "| Warnings | ${{ steps.clippy_count.outputs.warn }} |"
            echo "| Errors   | ${{ steps.clippy_count.outputs.err }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build & Test
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    outputs:
      tests_total: ${{ steps.test_metrics.outputs.tests_total }}
      tests_passed: ${{ steps.test_metrics.outputs.tests_passed }}
      tests_failed: ${{ steps.test_metrics.outputs.tests_failed }}
      tests_ignored: ${{ steps.test_metrics.outputs.tests_ignored }}
      tests_filtered: ${{ steps.test_metrics.outputs.tests_filtered }}
      tests_duration: ${{ steps.test_metrics.outputs.tests_duration }}
      binary_size: ${{ steps.bin_size.outputs.size }}
      binary_size_human: ${{ steps.bin_size.outputs.size_human }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2

      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build (static musl)
        run: cargo build --release --target x86_64-unknown-linux-musl

      - name: Unit tests
        # CARGO_TERM_COLOR=never so the libtest "test result: ok. N
        # passed; ..." summary lines are plain text and the counter grep
        # in 'Parse test metrics' below matches reliably.
        env:
          CARGO_TERM_COLOR: never
        run: cargo test --target x86_64-unknown-linux-musl 2>&1 | tee /tmp/test.log

      - name: Parse test metrics
        id: test_metrics
        if: always()
        run: |
          # Sum across every test binary's "test result: ok. N passed;" line.
          line_total=$(grep -oP 'running \K\d+(?= tests)' /tmp/test.log | awk '{s+=$1} END{print s+0}')
          line_pass=$(grep -oP '(?<=test result: ok\. )\d+(?= passed)' /tmp/test.log | awk '{s+=$1} END{print s+0}')
          line_pass_fail=$(grep -oP '(?<=test result: FAILED\. )\d+(?= passed)' /tmp/test.log | awk '{s+=$1} END{print s+0}')
          line_pass=$(( line_pass + line_pass_fail ))
          line_fail=$(grep -oP '\d+(?= failed)' /tmp/test.log | awk '{s+=$1} END{print s+0}')
          line_ignored=$(grep -oP '\d+(?= ignored)' /tmp/test.log | awk '{s+=$1} END{print s+0}')
          line_filtered=$(grep -oP '\d+(?= filtered out)' /tmp/test.log | awk '{s+=$1} END{print s+0}')
          duration=$(grep -oP 'finished in \K[0-9.]+s' /tmp/test.log | tail -1)
          {
            echo "tests_total=$line_total"
            echo "tests_passed=$line_pass"
            echo "tests_failed=$line_fail"
            echo "tests_ignored=$line_ignored"
            echo "tests_filtered=$line_filtered"
            echo "tests_duration=$duration"
          } >> "$GITHUB_OUTPUT"

      - name: Smoke test binary
        run: |
          ./target/x86_64-unknown-linux-musl/release/clone --help
          file target/x86_64-unknown-linux-musl/release/clone
          ls -lh target/x86_64-unknown-linux-musl/release/clone

      - name: Capture binary size
        id: bin_size
        run: |
          bin=target/x86_64-unknown-linux-musl/release/clone
          size=$(stat -c%s "$bin")
          size_human=$(numfmt --to=iec --suffix=B --format='%.2f' "$size")
          echo "size=$size" >> "$GITHUB_OUTPUT"
          echo "size_human=$size_human" >> "$GITHUB_OUTPUT"

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: clone-linux-x86_64
          path: target/x86_64-unknown-linux-musl/release/clone
          retention-days: 7

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Build & Test"
            echo
            echo "| Metric | Value |"
            echo "|---|---|"
            echo "| Total tests | ${{ steps.test_metrics.outputs.tests_total }} |"
            echo "| Passed | ${{ steps.test_metrics.outputs.tests_passed }} |"
            echo "| Failed | ${{ steps.test_metrics.outputs.tests_failed }} |"
            echo "| Ignored | ${{ steps.test_metrics.outputs.tests_ignored }} |"
            echo "| Filtered out | ${{ steps.test_metrics.outputs.tests_filtered }} |"
            echo "| Duration | ${{ steps.test_metrics.outputs.tests_duration }} |"
            echo "| Binary size | ${{ steps.bin_size.outputs.size_human }} (${{ steps.bin_size.outputs.size }} bytes) |"
            echo
            echo "Static musl binary uploaded as artifact \`clone-linux-x86_64\`."
          } >> "$GITHUB_STEP_SUMMARY"

  msrv:
    name: MSRV check
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.87
      - uses: Swatinem/rust-cache@v2
      - name: cargo check (MSRV 1.87)
        run: cargo check
      - name: Job summary
        if: always()
        run: |
          {
            echo "## MSRV check (1.87)"
            echo
            echo "Result: \`${{ job.status }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deny:
    name: Dependency check
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: EmbarkStudios/cargo-deny-action@v2
      - name: Job summary
        if: always()
        run: |
          {
            echo "## Dependency check (cargo-deny)"
            echo
            echo "Result: \`${{ job.status }}\` (advisories + bans + licenses + sources)"
          } >> "$GITHUB_STEP_SUMMARY"

  security:
    name: Security audit
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v6
      # Pinned to master HEAD (commit 858dc40, 2026-03-20) because the
      # v2 floating tag still ships Node 20 — upstream merged the Node
      # 24 bump (#48) onto master but has not cut a v2.x.x release yet,
      # so the v2 ref triggers GitHub's Node 20 deprecation warning.
      # Drop this pin and switch back to @v2 once a release tag with
      # Node 24 lands.
      - uses: rustsec/audit-check@858dc40f52ca2b8570b7a997c1c4e35c6fc9a432
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Job summary
        if: always()
        run: |
          {
            echo "## Security audit (rustsec)"
            echo
            echo "Result: \`${{ job.status }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  summary:
    name: PR summary (CI build)
    runs-on: ubuntu-latest
    needs: [changes, fmt, clippy, build, msrv, deny, security]
    if: always()
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Aggregate job results
        id: agg
        run: |
          icon() {
            case "$1" in
              success) echo "✅" ;;
              failure) echo "❌" ;;
              cancelled) echo "🚫" ;;
              skipped) echo "⏭️" ;;
              *) echo "❓" ;;
            esac
          }

          # Per-job result with icon.
          changes_r="${{ needs.changes.result }}"
          fmt_r="${{ needs.fmt.result }}"
          clippy_r="${{ needs.clippy.result }}"
          build_r="${{ needs.build.result }}"
          msrv_r="${{ needs.msrv.result }}"
          deny_r="${{ needs.deny.result }}"
          security_r="${{ needs.security.result }}"

          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          sha_short="$(echo "${{ github.sha }}" | cut -c1-7)"

          # Compose markdown body.
          {
            echo "## CI · Build & Test — \`$sha_short\`"
            echo
            echo "Run: [#${{ github.run_number }}]($run_url)"
            echo
            echo "| Job | Result |"
            echo "|---|---|"
            echo "| Detect changes  | $(icon $changes_r) \`$changes_r\` |"
            echo "| Format          | $(icon $fmt_r) \`$fmt_r\` |"
            echo "| Clippy          | $(icon $clippy_r) \`$clippy_r\` |"
            echo "| Build & Test    | $(icon $build_r) \`$build_r\` |"
            echo "| MSRV check      | $(icon $msrv_r) \`$msrv_r\` |"
            echo "| Dependency check| $(icon $deny_r) \`$deny_r\` |"
            echo "| Security audit  | $(icon $security_r) \`$security_r\` |"
            echo
            if [ "$build_r" = "success" ]; then
              echo "**Tests:** ${{ needs.build.outputs.tests_passed }} passed · ${{ needs.build.outputs.tests_failed }} failed · ${{ needs.build.outputs.tests_ignored }} ignored · ${{ needs.build.outputs.tests_filtered }} filtered out (in ${{ needs.build.outputs.tests_duration }})"
              echo
              echo "**Binary:** \`target/x86_64-unknown-linux-musl/release/clone\` — ${{ needs.build.outputs.binary_size_human }} ([download artifact]($run_url#artifacts))"
            else
              echo "_Build & Test did not finish successfully; see job log for details._"
            fi
            echo
            echo "<sub>Updated by \`build.yml\` · sticky-comment header \`ci-build\`.</sub>"
          } > /tmp/body.md

          # Capture the body for the next step (multi-line via heredoc).
          {
            echo "body<<MARKDOWN_EOF"
            cat /tmp/body.md
            echo "MARKDOWN_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Write step summary
        run: cat /tmp/body.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upsert sticky PR comment
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: ci-build
          message: ${{ steps.agg.outputs.body }}

      - name: Gate on upstream results
        # Mirrors the chain's overall status onto this aggregator job so
        # branch protection can require a single check ("PR summary (CI
        # build)") and still get fail propagation from any upstream job.
        if: |
          contains(fromJSON('["failure","cancelled"]'), needs.changes.result) ||
          contains(fromJSON('["failure","cancelled"]'), needs.fmt.result) ||
          contains(fromJSON('["failure","cancelled"]'), needs.clippy.result) ||
          contains(fromJSON('["failure","cancelled"]'), needs.build.result) ||
          contains(fromJSON('["failure","cancelled"]'), needs.msrv.result) ||
          contains(fromJSON('["failure","cancelled"]'), needs.deny.result) ||
          contains(fromJSON('["failure","cancelled"]'), needs.security.result)
        run: |
          echo "One or more upstream jobs failed; failing aggregator."
          exit 1
