name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_call:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            code:
              - 'src/**'
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'tests/**'
      - name: Job summary
        run: |
          {
            echo "## Detect changes"
            echo
            echo "Code-relevant paths changed: \`${{ steps.filter.outputs.code }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  fmt:
    name: Format
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: cargo fmt --check
        run: cargo fmt -- --check
      - name: Job summary
        if: always()
        run: |
          status="${{ job.status }}"
          {
            echo "## Format"
            echo
            echo "Result: \`$status\` (cargo fmt -- --check)"
          } >> "$GITHUB_STEP_SUMMARY"

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo clippy -- -D warnings
        # CARGO_TERM_COLOR=always at the workflow level wraps every
        # 'warning:'/'error:' marker in ANSI escapes, which breaks the
        # 'grep -E "^warning:"' counter below. Disable color for this
        # one step so the log is plain text.
        env:
          CARGO_TERM_COLOR: never
        run: cargo clippy -- -D warnings 2>&1 | tee /tmp/clippy.log
      - name: Count warnings/errors
        id: clippy_count
        if: always()
        run: |
          warn=$(grep -cE "^warning:" /tmp/clippy.log || true)
          err=$(grep -cE "^error:" /tmp/clippy.log || true)
          echo "warn=$warn" >> "$GITHUB_OUTPUT"
          echo "err=$err"   >> "$GITHUB_OUTPUT"
      - name: Job summary
        if: always()
        run: |
          {
            echo "## Clippy (deny warnings)"
            echo
            echo "| Metric | Count |"
            echo "|---|---|"
            echo "| Warnings | ${{ steps.clippy_count.outputs.warn }} |"
            echo "| Errors   | ${{ steps.clippy_count.outputs.err }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build & Test
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    outputs:
      tests_total: ${{ steps.test_metrics.outputs.tests_total }}
      tests_passed: ${{ steps.test_metrics.outputs.tests_passed }}
      tests_failed: ${{ steps.test_metrics.outputs.tests_failed }}
      tests_ignored: ${{ steps.test_metrics.outputs.tests_ignored }}
      tests_filtered: ${{ steps.test_metrics.outputs.tests_filtered }}
      tests_duration: ${{ steps.test_metrics.outputs.tests_duration }}
      binary_size: ${{ steps.bin_size.outputs.size }}
      binary_size_human: ${{ steps.bin_size.outputs.size_human }}
      cache_hit: ${{ steps.cache.outputs.cache-hit }}
      per_binary: ${{ steps.test_metrics.outputs.per_binary }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      # Capture id so the summary aggregator can surface cache-hit
      # vs cache-miss in the dashboard alongside the build duration.
      - id: cache
        uses: Swatinem/rust-cache@v2

      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build (static musl)
        run: cargo build --release --target x86_64-unknown-linux-musl

      - name: Unit tests
        # CARGO_TERM_COLOR=never so the libtest "test result: ok. N
        # passed; ..." summary lines are plain text and the counter grep
        # in 'Parse test metrics' below matches reliably.
        env:
          CARGO_TERM_COLOR: never
        run: cargo test --target x86_64-unknown-linux-musl 2>&1 | tee /tmp/test.log

      - name: Parse test metrics
        id: test_metrics
        if: always()
        run: |
          # Sum across every test binary's "test result: ok. N passed;" line.
          line_total=$(grep -oP 'running \K\d+(?= tests)' /tmp/test.log | awk '{s+=$1} END{print s+0}')
          line_pass=$(grep -oP '(?<=test result: ok\. )\d+(?= passed)' /tmp/test.log | awk '{s+=$1} END{print s+0}')
          line_pass_fail=$(grep -oP '(?<=test result: FAILED\. )\d+(?= passed)' /tmp/test.log | awk '{s+=$1} END{print s+0}')
          line_pass=$(( line_pass + line_pass_fail ))
          line_fail=$(grep -oP '\d+(?= failed)' /tmp/test.log | awk '{s+=$1} END{print s+0}')
          line_ignored=$(grep -oP '\d+(?= ignored)' /tmp/test.log | awk '{s+=$1} END{print s+0}')
          line_filtered=$(grep -oP '\d+(?= filtered out)' /tmp/test.log | awk '{s+=$1} END{print s+0}')
          duration=$(grep -oP 'finished in \K[0-9.]+s' /tmp/test.log | tail -1)

          # Per-binary breakdown: cargo test prefixes every test binary
          # block with a 'Running unittests src/main.rs (target/.../<id>)'
          # or 'Running tests/<file>.rs (target/.../<id>)' line followed
          # by 'running N tests'. Walk the log in order, emit one row
          # per binary as 'name|count'.
          awk '
            /^[[:space:]]*Running .* \(target/ {
              # Pull the binary basename out of the parenthesised path,
              # then strip the trailing -<hash>.
              p = $0
              sub(/.*\(/, "", p); sub(/\).*/, "", p)
              n = p; sub(/.*\//, "", n); sub(/-[a-f0-9]+$/, "", n)
              cur = n
              next
            }
            /^running [0-9]+ tests?$/ && cur != "" {
              c = $2
              printf "%s|%d\n", cur, c
              cur = ""
            }
          ' /tmp/test.log > /tmp/per_binary.tsv

          {
            echo "tests_total=$line_total"
            echo "tests_passed=$line_pass"
            echo "tests_failed=$line_fail"
            echo "tests_ignored=$line_ignored"
            echo "tests_filtered=$line_filtered"
            echo "tests_duration=$duration"
            echo "per_binary<<MARKDOWN_EOF"
            awk -F'|' '{printf "| <code>%s</code> | %d |\n", $1, $2}' /tmp/per_binary.tsv
            echo "MARKDOWN_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Smoke test binary
        run: |
          ./target/x86_64-unknown-linux-musl/release/clone --help
          file target/x86_64-unknown-linux-musl/release/clone
          ls -lh target/x86_64-unknown-linux-musl/release/clone

      - name: Capture binary size
        id: bin_size
        run: |
          bin=target/x86_64-unknown-linux-musl/release/clone
          size=$(stat -c%s "$bin")
          size_human=$(numfmt --to=iec --suffix=B --format='%.2f' "$size")
          echo "size=$size" >> "$GITHUB_OUTPUT"
          echo "size_human=$size_human" >> "$GITHUB_OUTPUT"

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: clone-linux-x86_64
          path: target/x86_64-unknown-linux-musl/release/clone
          retention-days: 7

      - name: Write metrics manifest
        # Snapshot the CI build's headline metrics into a tiny JSON file
        # so the summary aggregator on a future PR run can fetch this
        # run's artifact and compute deltas vs base. Uploaded to a
        # dedicated 30-day artifact so it survives the binary's 7-day
        # retention window.
        run: |
          cat > /tmp/metrics-build.json <<EOF
          {
            "tests_passed": ${{ steps.test_metrics.outputs.tests_passed }},
            "tests_failed": ${{ steps.test_metrics.outputs.tests_failed }},
            "tests_ignored": ${{ steps.test_metrics.outputs.tests_ignored }},
            "tests_filtered": ${{ steps.test_metrics.outputs.tests_filtered }},
            "binary_size": ${{ steps.bin_size.outputs.size }}
          }
          EOF
      - name: Upload metrics manifest
        uses: actions/upload-artifact@v7
        with:
          name: metrics-build
          path: /tmp/metrics-build.json
          retention-days: 30

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Build & Test"
            echo
            echo "| Metric | Value |"
            echo "|---|---|"
            echo "| Total tests | ${{ steps.test_metrics.outputs.tests_total }} |"
            echo "| Passed | ${{ steps.test_metrics.outputs.tests_passed }} |"
            echo "| Failed | ${{ steps.test_metrics.outputs.tests_failed }} |"
            echo "| Ignored | ${{ steps.test_metrics.outputs.tests_ignored }} |"
            echo "| Filtered out | ${{ steps.test_metrics.outputs.tests_filtered }} |"
            echo "| Duration | ${{ steps.test_metrics.outputs.tests_duration }} |"
            echo "| Binary size | ${{ steps.bin_size.outputs.size_human }} (${{ steps.bin_size.outputs.size }} bytes) |"
            echo
            echo "Static musl binary uploaded as artifact \`clone-linux-x86_64\`."
          } >> "$GITHUB_STEP_SUMMARY"

  msrv:
    name: MSRV check
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.87
      - uses: Swatinem/rust-cache@v2
      - name: cargo check (MSRV 1.87)
        run: cargo check
      - name: Job summary
        if: always()
        run: |
          {
            echo "## MSRV check (1.87)"
            echo
            echo "Result: \`${{ job.status }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deny:
    name: Dependency check
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: EmbarkStudios/cargo-deny-action@v2
      - name: Job summary
        if: always()
        run: |
          {
            echo "## Dependency check (cargo-deny)"
            echo
            echo "Result: \`${{ job.status }}\` (advisories + bans + licenses + sources)"
          } >> "$GITHUB_STEP_SUMMARY"

  security:
    name: Security audit
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    outputs:
      advisories: ${{ steps.audit_json.outputs.advisories }}
      advisory_count: ${{ steps.audit_json.outputs.advisory_count }}
    steps:
      - uses: actions/checkout@v6
      # Pinned to master HEAD (commit 858dc40, 2026-03-20) because the
      # v2 floating tag still ships Node 20 — upstream merged the Node
      # 24 bump (#48) onto master but has not cut a v2.x.x release yet,
      # so the v2 ref triggers GitHub's Node 20 deprecation warning.
      # Drop this pin and switch back to @v2 once a release tag with
      # Node 24 lands.
      - uses: rustsec/audit-check@858dc40f52ca2b8570b7a997c1c4e35c6fc9a432
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Capture audit advisories (JSON)
        # rustsec/audit-check posts annotations to the run page, but
        # the dashboard sticky needs the actual advisory IDs and links
        # so the reviewer can see RUSTSEC-YYYY-NNNN at a glance. Run
        # cargo-audit a second time directly with --json so we can
        # extract structured records into a markdown list.
        id: audit_json
        if: always()
        run: |
          if ! command -v cargo-audit >/dev/null 2>&1; then
            cargo install --locked cargo-audit >/dev/null 2>&1 || true
          fi
          cargo audit --json > /tmp/audit.json 2>/tmp/audit.err || true
          n=$(jq -r '.vulnerabilities.count // 0' /tmp/audit.json 2>/dev/null || echo 0)
          if [ "$n" = "0" ] || [ -z "$n" ]; then
            echo "advisory_count=0" >> "$GITHUB_OUTPUT"
            echo "advisories=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Render markdown rows.
          jq -r '.vulnerabilities.list[] |
            "| [" + .advisory.id + "](https://rustsec.org/advisories/" + .advisory.id + ".html) | " + .package.name + " " + .package.version + " | " + (.advisory.title|gsub("[\\|\\n]";" ")) + " |"
          ' /tmp/audit.json > /tmp/audit-rows.md
          {
            echo "advisory_count=$n"
            echo "advisories<<MARKDOWN_EOF"
            cat /tmp/audit-rows.md
            echo "MARKDOWN_EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Job summary
        if: always()
        run: |
          {
            echo "## Security audit (rustsec)"
            echo
            echo "Result: \`${{ job.status }}\` · advisories: \`${{ steps.audit_json.outputs.advisory_count }}\`"
            count="${{ steps.audit_json.outputs.advisory_count }}"
            if [ -n "$count" ] && [ "$count" != "0" ]; then
              echo
              echo "| ID | Package | Title |"
              echo "|---|---|---|"
              echo "${{ steps.audit_json.outputs.advisories }}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  summary:
    name: PR summary (CI build)
    runs-on: ubuntu-latest
    needs: [changes, fmt, clippy, build, msrv, deny, security]
    if: always()
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Fetch base-branch metrics
        # On pull_request runs, find the most recent successful CI run
        # on the PR's base branch and download its 'metrics-build'
        # artifact. The aggregator step below uses these numbers to
        # render delta lines (tests / binary size) so reviewers see
        # what this PR actually moves. Best-effort: any failure here
        # leaves the values at the placeholder 'n/a' and the delta
        # rendering simply omits the delta column.
        if: github.event_name == 'pull_request'
        id: base
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          base_ref="${{ github.base_ref }}"
          repo="${{ github.repository }}"
          # Workflow numeric ID (so we don't depend on the display name).
          wf_id=$(gh api "repos/$repo/actions/workflows/build.yml" --jq '.id')
          base_run=$(gh api "repos/$repo/actions/workflows/$wf_id/runs?branch=$base_ref&status=success&per_page=1" --jq '.workflow_runs[0].id')
          if [ -z "$base_run" ] || [ "$base_run" = "null" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          art_id=$(gh api "repos/$repo/actions/runs/$base_run/artifacts" --jq '.artifacts[] | select(.name=="metrics-build") | .id' | head -1)
          if [ -z "$art_id" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p /tmp/base
          gh api -H 'Accept: application/vnd.github+json' "repos/$repo/actions/artifacts/$art_id/zip" > /tmp/base/m.zip
          unzip -o /tmp/base/m.zip -d /tmp/base >/dev/null 2>&1 || true
          if [ ! -f /tmp/base/metrics-build.json ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Extract base values via jq.
          base_tests=$(jq -r .tests_passed /tmp/base/metrics-build.json)
          base_size=$(jq -r .binary_size /tmp/base/metrics-build.json)
          {
            echo "available=true"
            echo "base_run_id=$base_run"
            echo "tests_passed=$base_tests"
            echo "binary_size=$base_size"
          } >> "$GITHUB_OUTPUT"

      - name: Fetch run timing
        # Pull job-level started_at / completed_at from the API so
        # the dashboard can render a 'Duration' column without each
        # job having to track its own clock. Using the run's own
        # GITHUB_TOKEN keeps the call inside the run's permission
        # scope; failure here just leaves the column blank.
        id: timing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          repo="${{ github.repository }}"
          run_id="${{ github.run_id }}"
          # Allow upstream jobs to settle into 'completed' before we
          # query — the aggregator's 'if: always()' fires alongside.
          gh api "repos/$repo/actions/runs/$run_id/jobs?per_page=100" \
            --jq '.jobs[] | "\(.name)\t\(.started_at)\t\(.completed_at)"' \
            > /tmp/jobs.tsv 2>/dev/null
          # Convert to "name|seconds" pairs for downstream rendering.
          : > /tmp/job_durations.tsv
          while IFS=$'\t' read -r name s c; do
            [ -z "$s" ] || [ -z "$c" ] || [ "$s" = "null" ] || [ "$c" = "null" ] && continue
            ss=$(date -d "$s" +%s 2>/dev/null || echo 0)
            cc=$(date -d "$c" +%s 2>/dev/null || echo 0)
            d=$((cc - ss))
            [ "$d" -lt 0 ] && d=0
            printf "%s|%d\n" "$name" "$d" >> /tmp/job_durations.tsv
          done < /tmp/jobs.tsv

          # Helper to look up a job's duration by display name.
          lookup() {
            grep -F -- "$1|" /tmp/job_durations.tsv | head -1 | cut -d'|' -f2
          }
          {
            echo "changes_dur=$(lookup 'Detect changes')"
            echo "fmt_dur=$(lookup 'Format')"
            echo "clippy_dur=$(lookup 'Clippy')"
            echo "build_dur=$(lookup 'Build & Test')"
            echo "msrv_dur=$(lookup 'MSRV check')"
            echo "deny_dur=$(lookup 'Dependency check')"
            echo "security_dur=$(lookup 'Security audit')"
          } >> "$GITHUB_OUTPUT"

      - name: Fetch base Cargo.lock for diff
        if: github.event_name == 'pull_request'
        id: lockdiff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          repo="${{ github.repository }}"
          base_sha="${{ github.event.pull_request.base.sha }}"
          # Pull base Cargo.lock content via the contents API.
          gh api "repos/$repo/contents/Cargo.lock?ref=$base_sha" --jq '.content' \
            | base64 -d > /tmp/base.lock 2>/dev/null
          if [ ! -s /tmp/base.lock ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # We can't access the PR's working tree from the aggregator
          # job (we never checkout). Pull current Cargo.lock the same
          # way using github.sha (which is the merge ref on PR runs).
          gh api "repos/$repo/contents/Cargo.lock?ref=${{ github.sha }}" --jq '.content' \
            | base64 -d > /tmp/cur.lock 2>/dev/null
          if [ ! -s /tmp/cur.lock ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Extract package@version pairs from each lock and compute
          # added / removed / upgraded sets. Each '[[package]]' block
          # has 'name = "x"' and 'version = "y"' on consecutive lines.
          extract() {
            awk '
              /^\[\[package\]\]/ { in_pkg = 1; n=""; v=""; next }
              in_pkg && /^name = / { gsub(/"/,""); n=$3; next }
              in_pkg && /^version = / { gsub(/"/,""); v=$3; printf "%s\t%s\n", n, v; in_pkg=0; n=""; v="" }
            ' "$1"
          }
          extract /tmp/base.lock | sort -u > /tmp/base.pkgs
          extract /tmp/cur.lock  | sort -u > /tmp/cur.pkgs

          # Added: in cur not in base (by name+version).
          comm -13 /tmp/base.pkgs /tmp/cur.pkgs > /tmp/added.tsv
          # Removed: in base not in cur.
          comm -23 /tmp/base.pkgs /tmp/cur.pkgs > /tmp/removed.tsv
          # Upgrades: name appears in both with different versions.
          # Build name-keyed dicts and intersect.
          awk -F'\t' 'NR==FNR { base[$1]=$2; next } $1 in base && base[$1]!=$2 { printf "%s\t%s\t%s\n", $1, base[$1], $2 }' \
            /tmp/base.pkgs /tmp/cur.pkgs > /tmp/upgraded.tsv

          a=$(wc -l < /tmp/added.tsv)
          r=$(wc -l < /tmp/removed.tsv)
          u=$(wc -l < /tmp/upgraded.tsv)

          # Render markdown — only the non-empty sections, with each
          # capped at 20 rows so we don't blow past the comment limit.
          : > /tmp/lockdiff.md
          if [ "$u" -gt 0 ]; then
            echo "**Upgraded ($u):**" >> /tmp/lockdiff.md
            head -20 /tmp/upgraded.tsv | awk -F'\t' '{printf "- `%s`: `%s` → `%s`\n", $1, $2, $3}' >> /tmp/lockdiff.md
            [ "$u" -gt 20 ] && echo "- _…and $((u-20)) more_" >> /tmp/lockdiff.md
            echo >> /tmp/lockdiff.md
          fi
          if [ "$a" -gt 0 ]; then
            echo "**Added ($a):**" >> /tmp/lockdiff.md
            head -20 /tmp/added.tsv | awk -F'\t' '{printf "- `%s` `%s`\n", $1, $2}' >> /tmp/lockdiff.md
            [ "$a" -gt 20 ] && echo "- _…and $((a-20)) more_" >> /tmp/lockdiff.md
            echo >> /tmp/lockdiff.md
          fi
          if [ "$r" -gt 0 ]; then
            echo "**Removed ($r):**" >> /tmp/lockdiff.md
            head -20 /tmp/removed.tsv | awk -F'\t' '{printf "- `%s` `%s`\n", $1, $2}' >> /tmp/lockdiff.md
            [ "$r" -gt 20 ] && echo "- _…and $((r-20)) more_" >> /tmp/lockdiff.md
            echo >> /tmp/lockdiff.md
          fi
          if [ "$a" = "0" ] && [ "$r" = "0" ] && [ "$u" = "0" ]; then
            echo "_Cargo.lock is identical to base._" > /tmp/lockdiff.md
          fi

          {
            echo "available=true"
            echo "added=$a"
            echo "removed=$r"
            echo "upgraded=$u"
            echo "diff_md<<MARKDOWN_EOF"
            cat /tmp/lockdiff.md
            echo "MARKDOWN_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Aggregate job results
        id: agg
        run: |
          icon() {
            case "$1" in
              success) echo "✅" ;;
              failure) echo "❌" ;;
              cancelled) echo "🚫" ;;
              skipped) echo "⏭️" ;;
              *) echo "❓" ;;
            esac
          }

          fmt_dur() {
            local s="$1"
            [ -z "$s" ] || [ "$s" = "0" ] && { echo "—"; return; }
            if [ "$s" -lt 60 ]; then echo "${s}s";
            else echo "$((s/60))m$((s%60))s"; fi
          }

          # Per-job result with icon.
          changes_r="${{ needs.changes.result }}"
          fmt_r="${{ needs.fmt.result }}"
          clippy_r="${{ needs.clippy.result }}"
          build_r="${{ needs.build.result }}"
          msrv_r="${{ needs.msrv.result }}"
          deny_r="${{ needs.deny.result }}"
          security_r="${{ needs.security.result }}"

          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          sha_short="$(echo "${{ github.sha }}" | cut -c1-7)"
          base_avail="${{ steps.base.outputs.available }}"
          cache_hit="${{ needs.build.outputs.cache_hit }}"
          [ "$cache_hit" = "true" ] && cache_label="✅ hit" || cache_label="❌ miss"
          [ -z "$cache_hit" ] && cache_label="—"

          # Compute delta strings (with sign) when base is available.
          tests_delta=""
          size_delta=""
          if [ "$base_avail" = "true" ]; then
            cur_tests=${{ needs.build.outputs.tests_passed }}
            cur_size=${{ needs.build.outputs.binary_size }}
            base_tests=${{ steps.base.outputs.tests_passed }}
            base_size=${{ steps.base.outputs.binary_size }}
            t=$((cur_tests - base_tests))
            s=$((cur_size - base_size))
            ts=""; [ "$t" -gt 0 ] && ts="+"
            ss=""; [ "$s" -gt 0 ] && ss="+"
            sh=$(numfmt --to=iec --suffix=B --format='%.2f' "${s#-}" 2>/dev/null || echo "${s} B")
            sgn=""; [ "$s" -gt 0 ] && sgn="+"; [ "$s" -lt 0 ] && sgn="-"
            tests_delta=" (${ts}${t} vs base)"
            size_delta=" (${sgn}${sh} vs base)"
          fi

          adv_count="${{ needs.security.outputs.advisory_count }}"

          # Compose markdown body.
          {
            echo "## CI · Build & Test — \`$sha_short\`"
            echo
            echo "Run: [#${{ github.run_number }}]($run_url) · cache: $cache_label"
            echo
            echo "| Job | Result | Duration |"
            echo "|---|---|---:|"
            echo "| Detect changes  | $(icon $changes_r) \`$changes_r\` | $(fmt_dur ${{ steps.timing.outputs.changes_dur }}) |"
            echo "| Format          | $(icon $fmt_r) \`$fmt_r\` | $(fmt_dur ${{ steps.timing.outputs.fmt_dur }}) |"
            echo "| Clippy          | $(icon $clippy_r) \`$clippy_r\` | $(fmt_dur ${{ steps.timing.outputs.clippy_dur }}) |"
            echo "| Build & Test    | $(icon $build_r) \`$build_r\` | $(fmt_dur ${{ steps.timing.outputs.build_dur }}) |"
            echo "| MSRV check      | $(icon $msrv_r) \`$msrv_r\` | $(fmt_dur ${{ steps.timing.outputs.msrv_dur }}) |"
            echo "| Dependency check| $(icon $deny_r) \`$deny_r\` | $(fmt_dur ${{ steps.timing.outputs.deny_dur }}) |"
            echo "| Security audit  | $(icon $security_r) \`$security_r\` | $(fmt_dur ${{ steps.timing.outputs.security_dur }}) |"
            echo
            if [ "$build_r" = "success" ]; then
              echo "**Tests:** ${{ needs.build.outputs.tests_passed }} passed${tests_delta} · ${{ needs.build.outputs.tests_failed }} failed · ${{ needs.build.outputs.tests_ignored }} ignored · ${{ needs.build.outputs.tests_filtered }} filtered out (in ${{ needs.build.outputs.tests_duration }})"
              echo
              echo "<details><summary>Per-binary breakdown</summary>"
              echo
              echo "| Binary | Tests |"
              echo "|---|---:|"
              echo "${{ needs.build.outputs.per_binary }}"
              echo
              echo "</details>"
              echo
              echo "**Binary:** \`target/x86_64-unknown-linux-musl/release/clone\` — ${{ needs.build.outputs.binary_size_human }}${size_delta} ([download artifact]($run_url#artifacts))"
            else
              echo "_Build & Test did not finish successfully; see job log for details._"
            fi

            if [ "$adv_count" != "0" ] && [ -n "$adv_count" ]; then
              echo
              echo "### Security advisories ($adv_count)"
              echo
              echo "| ID | Package | Title |"
              echo "|---|---|---|"
              echo "${{ needs.security.outputs.advisories }}"
            fi

            if [ "${{ steps.lockdiff.outputs.available }}" = "true" ]; then
              echo
              echo "### Cargo.lock diff (vs base)"
              echo
              echo "${{ steps.lockdiff.outputs.diff_md }}"
            fi

            if [ "$base_avail" != "true" ] && [ "${{ github.event_name }}" = "pull_request" ]; then
              echo
              echo "_Base-branch metrics unavailable for this run (no successful master CI run with metrics yet); deltas omitted._"
            fi
            echo
            echo "<sub>Updated by \`build.yml\` · sticky-comment header \`ci-build\`.</sub>"
          } > /tmp/body.md

          # Capture the body for the next step (multi-line via heredoc).
          {
            echo "body<<MARKDOWN_EOF"
            cat /tmp/body.md
            echo "MARKDOWN_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Write step summary
        run: cat /tmp/body.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upsert sticky PR comment
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: ci-build
          message: ${{ steps.agg.outputs.body }}

      - name: Gate on upstream results
        # Mirrors the chain's overall status onto this aggregator job so
        # branch protection can require a single check ("PR summary (CI
        # build)") and still get fail propagation from any upstream job.
        if: |
          contains(fromJSON('["failure","cancelled"]'), needs.changes.result) ||
          contains(fromJSON('["failure","cancelled"]'), needs.fmt.result) ||
          contains(fromJSON('["failure","cancelled"]'), needs.clippy.result) ||
          contains(fromJSON('["failure","cancelled"]'), needs.build.result) ||
          contains(fromJSON('["failure","cancelled"]'), needs.msrv.result) ||
          contains(fromJSON('["failure","cancelled"]'), needs.deny.result) ||
          contains(fromJSON('["failure","cancelled"]'), needs.security.result)
        run: |
          echo "One or more upstream jobs failed; failing aggregator."
          exit 1
