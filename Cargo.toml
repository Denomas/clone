[package]
name = "clone"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
description = "Minimal VMM for multi-tenant dev shells and serverless"
license = "MIT"
authors = ["Unix Shells Limited Company"]
homepage = "https://github.com/nicholasgasior/clone"
repository = "https://github.com/nicholasgasior/clone"
keywords = ["vmm", "kvm", "virtualization", "microvm", "serverless"]

[dependencies]
# async runtime
tokio = { version = "1", features = ["full"] }

# serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }

# error handling
anyhow = "1"
thiserror = "2"

# CLI
clap = { version = "4", features = ["derive"] }

# unix
libc = "0.2"

# cryptography — cross-platform
sha2 = "0.10"

# rust-vmm crates — Linux only (KVM)
[target.'cfg(target_os = "linux")'.dependencies]
kvm-ioctls = "0.19"
kvm-bindings = { version = "0.10", features = ["fam-wrappers"] }
vm-memory = { version = "0.16", features = ["backend-mmap"] }
linux-loader = { version = "0.13", features = ["bzimage", "elf"] }
virtio-queue = "0.14"
nix = { version = "0.29", features = ["fs", "ioctl", "mman", "net", "signal", "socket"] }
io-uring = { version = "0.7", optional = true }

[workspace]
members = [
    ".",
    "crates/guest-agent",
    "crates/clone-init",
]

[features]
default = []
io_uring = ["io-uring"]

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[[bin]]
name = "clone"
path = "src/main.rs"

# ── Clippy lint config (shift-left) ──────────────────────────────────────
# Errors: kept narrow so the lint gate stays green during regular dev.
# Warnings: high-signal lints that would have flagged the kinds of bugs
# we shipped (silent swallowed `Result`s, panicking on user input,
# integer overflow on guest-supplied lengths).
[workspace.lints.clippy]
# Hard errors — debugging leftovers and unfinished code never ship.
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
# The next set tend to flag real bugs (panicking on guest-supplied data,
# integer overflow in length fields, swallowed Results) but exist all over
# the legacy code; left at `allow` until that backlog is paid down so the
# clippy gate above stays meaningful.
unwrap_used = "allow"
expect_used = "allow"
indexing_slicing = "allow"
integer_division = "allow"
panic = "allow"
unreachable = "allow"

[lints]
workspace = true
